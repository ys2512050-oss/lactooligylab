<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LactooligyLAB</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f0f0f;
color:white;
}

header{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

h1{
font-size:70px;
margin-bottom:20px;
}

p{
font-size:22px;
color:#bbbbbb;
max-width:700px;
line-height:1.7;
margin-bottom:40px;
}

button{
padding:15px 35px;
font-size:18px;
border:none;
border-radius:50px;
cursor:pointer;
background:white;
color:black;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}
</style>

</head>

<body>

<header>

<h1>LactooligyLAB</h1>

<p>
Exploring the science of fermentation through research,
innovation, and culinary creativity.
</p>

<button>Explore Our Work</button>

</header>

</html>
