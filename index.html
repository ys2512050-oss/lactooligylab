<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LactooligyLAB</title>

<meta name="description" content="Fermentation Research Laboratory">

<link rel="icon" href="images/logo.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
scroll-behavior:smooth;
}

body{
background:#0d0f0e;
color:white;
overflow-x:hidden;
}

img{
max-width:100%;
display:block;
}

a{
text-decoration:none;
color:white;
}

nav{
position:fixed;
top:0;
left:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 8%;
background:#111;
border-bottom:1px solid #333;
z-index:1000;
}

.logo img{
height:55px;
}

nav ul{
display:flex;
list-style:none;
gap:30px;
}

nav ul li a{
font-weight:bold;
transition:.3s;
}

nav ul li a:hover{
color:#90ee90;
}

.hero{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:120px 20px 40px;
}

.hero h1{
font-size:clamp(42px,8vw,80px);
margin-bottom:20px;
}

.hero p{
max-width:750px;
line-height:1.8;
color:#bbbbbb;
margin-bottom:35px;
}

.button{
background:white;
color:black;
padding:15px 35px;
border-radius:50px;
font-weight:bold;
display:inline-block;
transition:.3s;
}

.button:hover{
transform:translateY(-5px);
}

.about,
.projects,
.contact{
padding:90px 8%;
}

.about{
background:#171a18;
text-align:center;
}

.about h2,
.projects h2,
.contact h2{
font-size:48px;
margin-bottom:30px;
}

.about p{
max-width:850px;
margin:auto;
line-height:1.9;
color:#cfcfcf;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
margin-top:50px;
}

.card{
background:#181b19;
border:1px solid #333;
border-radius:18px;
overflow:hidden;
transition:.3s;
}

.card:hover{
transform:translateY(-10px);
border-color:#90ee90;
}

.card img{
width:100%;
height:230px;
object-fit:cover;
}

.card h3{
margin:20px;
font-size:28px;
}

.card p{
margin:0 20px 25px;
line-height:1.7;
color:#bbb;
}

.contact{
background:#171a18;
text-align:center;
}

.contact p{
margin-bottom:25px;
color:#bbb;
}

footer{
padding:30px;
text-align:center;
color:#888;
}

@media(max-width:768px){

nav{
padding:15px 20px;
}

nav ul{
display:none;
}

.logo img{
height:45px;
}

.about,
.projects,
.contact{
padding:70px 20px;
}

.about h2,
.projects h2,
.contact h2{
font-size:36px;
}

.hero h1{
font-size:50px;
}

}

</style>

</head>
